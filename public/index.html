<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { margin: 0; color: #333; }
        .btn { background-color: #ff6f61; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
        .product-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .product-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .price { color: #28a745; font-size: 1.2em; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <header>
        <h1>Online Store</h1>
        <a href="/cart.html" class="btn">Go to Cart</a>
    </header>

    <main>
        <div id="productList" class="product-container">
            <p>Loading products...</p>
        </div>
    </main>

    <script>
        async function fetchProducts() {
            const productList = document.getElementById('productList');
            if (!productList) return;
            
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                
                productList.innerHTML = '';

                if (!Array.isArray(products) || products.length === 0) {
                    productList.innerHTML = '<p>No products found.</p>';
                    return;
                }

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <h3>${product.title}</h3>
                        <p>${product.description || ''}</p>
                        <div class="price">₹${product.price}</div>
                        <button class="btn" onclick="addToCart('${product.title}', ${product.price})">Add to Cart</button>
                    `;
                    productList.appendChild(card);
                });
            } catch (err) {
                productList.innerHTML = '<p style="color: red;">Error loading products.</p>';
            }
        }

        function addToCart(title, price) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let item = cart.find(p => p.title === title);
            if (item) { item.quantity += 1; } 
            else { cart.push({ title, price, quantity: 1 }); }
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Added to cart!');
        }

        fetchProducts();
    </script>
</body>
</html>
